# infra/cloudbuild.yaml
steps:
  # 1. Build the backend image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/rolehatch/api:${_TAG}"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/rolehatch/api:latest"
      - "./backend"

  # 2. Push both tags
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "us-central1-docker.pkg.dev/$PROJECT_ID/rolehatch/api:${_TAG}"]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "us-central1-docker.pkg.dev/$PROJECT_ID/rolehatch/api:latest"]

  # 3. Run migrations BEFORE deploying, inside the image we just built.
  #    Cloud Build defaults the working dir to /workspace, so point it at /app, where
  #    alembic.ini and the `app` package live (an absolute `dir` is used as-is).
  - name: "us-central1-docker.pkg.dev/$PROJECT_ID/rolehatch/api:${_TAG}"
    dir: "/app"
    entrypoint: alembic
    args: ["upgrade", "head"]
    secretEnv: ["DATABASE_URL"]

  # 4. Deploy to Cloud Run, secrets pulled fresh from Secret Manager each deploy.
  #    --update-* (not --set-*) for BOTH secrets and env vars, so anything configured
  #    outside this file (e.g. M-Pesa) is preserved instead of wiped on every deploy.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "rolehatch-api"
      - "--image=us-central1-docker.pkg.dev/$PROJECT_ID/rolehatch/api:${_TAG}"
      - "--region=us-central1"
      - "--allow-unauthenticated"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--memory=1Gi"
      - "--cpu-boost"
      - "--timeout=1800"
      # ^@^ switches the delimiter to "@" so ALLOWED_ORIGINS can contain commas.
      - "--update-env-vars=^@^ALLOWED_ORIGINS=https://perchrole.com,https://www.perchrole.com@UPSTASH_REDIS_URL=${_UPSTASH_URL}@FRONTEND_URL=https://perchrole.com@SUPABASE_URL=${_SUPABASE_URL}"
      # Previous Perchie provider (Anthropic), kept for future use. To switch back, uncomment this
      # line and comment out the Gemini line below (the anthropic-api-key secret must exist in main.tf):
      # - "--update-secrets=DATABASE_URL=database-url:latest,SUPABASE_JWT_SECRET=supabase-jwt-secret:latest,UPSTASH_REDIS_TOKEN=upstash-token:latest,SCHEDULER_SECRET=scheduler-secret:latest,PAYSTACK_SECRET_KEY=paystack-secret-key:latest,REVALIDATE_SECRET=revalidate-secret:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest"
      # Active Perchie provider: Google AI Studio (Gemini)
      - "--update-secrets=DATABASE_URL=database-url:latest,SUPABASE_JWT_SECRET=supabase-jwt-secret:latest,UPSTASH_REDIS_TOKEN=upstash-token:latest,SCHEDULER_SECRET=scheduler-secret:latest,PAYSTACK_SECRET_KEY=paystack-secret-key:latest,REVALIDATE_SECRET=revalidate-secret:latest,GEMINI_API_KEY=gemini-api-key:latest"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/database-url/versions/latest
      env: DATABASE_URL

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/rolehatch/api:${_TAG}"
  - "us-central1-docker.pkg.dev/$PROJECT_ID/rolehatch/api:latest"

substitutions:
  _TAG: "manual"                    # triggers override this with $SHORT_SHA; manual runs pass a unique value
  _UPSTASH_URL: "https://your-instance.upstash.io"
  _SUPABASE_URL: "https://your-project-ref.supabase.co"

options:
  logging: CLOUD_LOGGING_ONLY